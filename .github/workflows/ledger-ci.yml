name: Ledger Service CI/CD

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main

env:
  IMAGE_NAME: ledger-service

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout source code
      uses: actions/checkout@v4

    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: maven

    - name: Build application
      run: mvn clean package -DskipTests

    - name: Upload jar artifact
      uses: actions/upload-artifact@v4
      with:
        name: ledger-jar
        path: target/*.jar

  docker:

    needs: build

    runs-on: ubuntu-latest

    steps:

    - name: Checkout source
      uses: actions/checkout@v4

    - name: Download JAR
      uses: actions/download-artifact@v4
      with:
        name: ledger-jar
        path: target/

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build Docker image
      run: |
        docker build \
        -t ${{ secrets.DOCKER_USERNAME }}/ledger-service:${{ github.sha }} \
        -t ${{ secrets.DOCKER_USERNAME }}/ledger-service:latest .

    - name: Push Docker image
      run: |
        docker push ${{ secrets.DOCKER_USERNAME }}/ledger-service:${{ github.sha }}

        docker push ${{ secrets.DOCKER_USERNAME }}/ledger-service:latest
