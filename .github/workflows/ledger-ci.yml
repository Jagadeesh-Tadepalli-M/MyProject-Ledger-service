name: Ledger Enterprise DevSecOps Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read
  security-events: write

env:
  AWS_REGION: ap-southeast-2
  ECR_REPOSITORY: ledger-service
  ECR_REGISTRY: 339140804096.dkr.ecr.ap-southeast-2.amazonaws.com
  IMAGE_NAME: ledger-service

jobs:

  build-test-security:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4

        with:
          distribution: temurin
          java-version: 17
          cache: maven

      #################################################
      # BUILD + UNIT TEST
      #################################################

      - name: Build and Unit Test
        run: mvn clean verify

      #################################################
      # CODE COVERAGE
      #################################################

      - name: Upload JaCoCo Coverage
        uses: actions/upload-artifact@v4

        with:
          name: jacoco-report
          path: target/site/jacoco/

      #################################################
      # SCA (OWASP)
      #################################################

      - name: OWASP Dependency Check
        run: |
          mvn org.owasp:dependency-check-maven:check

      - name: Upload OWASP Report
        uses: actions/upload-artifact@v4

        with:
          name: dependency-check-report
          path: target/dependency-check-report.html

      #################################################
      # SAST (SONARCLOUD)
      #################################################

      - name: SonarCloud Scan

        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

        run: |
          mvn sonar:sonar \
          -Dsonar.projectKey=Jagadeesh-Tadepalli-M_MyProject-Ledger-service \
          -Dsonar.organization=jagadeesh-tadepalli-m \
          -Dsonar.host.url=https://sonarcloud.io \
          -Dsonar.token=${SONAR_TOKEN}

      #################################################
      # QUALITY GATE
      #################################################

      # Enable after SonarCloud project is fully configured

      # - name: SonarCloud Quality Gate
      #   uses: sonarsource/sonarqube-quality-gate-action@v1.1.0
      #
      #   timeout-minutes: 5
      #
      #   with:
      #     scanMetadataReportFile: target/sonar/report-task.txt
      #
      #   env:
      #     SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      #################################################
      # STORE JAR
      #################################################

      - name: Upload JAR Artifact
        uses: actions/upload-artifact@v4

        with:
          name: ledger-jar
          path: target/*.jar

  docker-build-scan-push:

    needs: build-test-security

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4

        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Download JAR Artifact
        uses: actions/download-artifact@v4

        with:
          name: ledger-jar
          path: target/

      #################################################
      # BUILD IMAGE
      #################################################

      - name: Build Docker Image
        run: |
          docker build -t $IMAGE_NAME:latest .

      #################################################
      # CONTAINER SCAN
      #################################################

      - name: Trivy Image Scan
        uses: aquasecurity/trivy-action@master

        with:
          image-ref: ledger-service:latest
          format: table
          severity: CRITICAL,HIGH

      #################################################
      # PUSH TO ECR
      #################################################

      - name: Tag Docker Image
        run: |
          docker tag $IMAGE_NAME:latest \
          $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}

          docker tag $IMAGE_NAME:latest \
          $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Push Docker Image
        run: |
          docker push \
          $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}

          docker push \
          $ECR_REGISTRY/$ECR_REPOSITORY:latest

  zap-dast-security:

    needs: docker-build-scan-push

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      #################################################
      # BUILD IMAGE
      #################################################

      - name: Build Docker Image
        run: |
          docker build -t ledger-service:latest .

      #################################################
      # START APPLICATION
      #################################################

      - name: Start Ledger Service
        run: |
          docker run -d \
            --name ledger-service \
            -p 8081:8081 \
            ledger-service:latest

      - name: Wait For Startup
        run: sleep 45

      #################################################
      # DAST
      #################################################

      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0

        with:
          target: http://localhost:8081

      - name: Upload ZAP Report
        uses: actions/upload-artifact@v4

        with:
          name: zap-report
          path: report_html.html
