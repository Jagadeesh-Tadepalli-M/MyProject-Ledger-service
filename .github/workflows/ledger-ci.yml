name: Ledger Enterprise DevSecOps Pipeline

on:
  push:
    branches:
      - main
      - dev

  pull_request:
    branches:
      - main

permissions:
  contents: read
  security-events: write

env:
  AWS_REGION: ap-southeast-2
  ECR_REPOSITORY: ledger-service
  ECR_REGISTRY: 339140804096.dkr.ecr.ap-southeast-2.amazonaws.com
  IMAGE_NAME: ledger-service

jobs:

  build-test-security:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4

        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Maven Build + Tests + JaCoCo
        run: mvn clean verify

      - name: Upload JAR Artifact
        uses: actions/upload-artifact@v4

        with:
          name: ledger-jar
          path: target/*.jar

      - name: Upload JaCoCo Report
        uses: actions/upload-artifact@v4

        with:
          name: jacoco-report
          path: target/site/jacoco/
          if-no-files-found: warn

      - name: SonarCloud Scan

        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

        run: |
          mvn sonar:sonar \
            -Dsonar.projectKey=Jagadeesh-Tadepalli-M_MyProject-Ledger-service \
            -Dsonar.organization=jagadeesh-tadepalli-m \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.token=${{ secrets.SONAR_TOKEN }}
      
      - name: Verify Sonar Report

        run: |
          echo "Checking Sonar report..."
          find . -name "report-task.txt"


      - name: SonarCloud Quality Gate
        uses: sonarsource/sonarqube-quality-gate-action@master

        timeout-minutes: 5
         
        with:
          scanMetadataReportFile: target/sonar/report-task.txt

        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Verify NVD Secret
        run: |
          if [ -z "${{ secrets.NVD_API_KEY }}" ]; then
            echo "NVD_API_KEY is missing"
            exit 1
          else
            echo "NVD_API_KEY is configured"
          fi

      - name: OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main

        with:
          project: ledger-service
          path: .
          format: HTML
          args: >
            --nvdApiKey ${{ secrets.NVD_API_KEY }}


      - name: Upload OWASP Report
        uses: actions/upload-artifact@v4

        with:
          name: dependency-check-report
          path: reports/

      - name: Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@master

        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: CRITICAL,HIGH

  docker-build-scan-push:

    needs: build-test-security

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4

        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Download JAR Artifact
        uses: actions/download-artifact@v4

        with:
          name: ledger-jar
          path: target/

      - name: Build Docker Image
        run: |
          docker build -t $IMAGE_NAME:latest .

      - name: Clair Container Scan
        continue-on-error: true
        uses: quay/clair-action@v0.3.0

        with:
          image-ref: ledger-service:latest

      - name: Trivy Docker Image Scan
        uses: aquasecurity/trivy-action@master

        with:
          image-ref: ledger-service:latest
          format: table
          severity: CRITICAL,HIGH

      - name: Tag Docker Image
        run: |
          docker tag $IMAGE_NAME:latest \
          $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}

          docker tag $IMAGE_NAME:latest \
          $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Push Docker Image
        run: |
          docker push \
          $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}

          docker push \
          $ECR_REGISTRY/$ECR_REPOSITORY:latest

  zap-dast-security:

    needs: docker-build-scan-push

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build -t ledger-service:latest .

      - name: Start Ledger Service
        run: |
          docker run -d \
            --name ledger-service \
            -p 8081:8081 \
            ledger-service:latest

      - name: Wait for Application Startup
        run: sleep 40

      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0

        with:
          target: http://localhost:8081

      - name: Upload ZAP Report
        uses: actions/upload-artifact@v4

        with:
          name: zap-report
          path: report_html.html

