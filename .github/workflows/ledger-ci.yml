name: Ledger Enterprise DevSecOps Pipeline

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main

env:
  NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
  AWS_REGION: ap-southeast-2
  ECR_REPOSITORY: ledger-service
  ECR_REGISTRY: 339140804096.dkr.ecr.ap-southeast-2.amazonaws.com

jobs:

  build-test-security:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Maven Build
        run: mvn clean verify

      - name: Upload JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ledger-jar
          path: target/*.jar

      - name: Upload JaCoCo Report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/

      - name: SonarCloud Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn sonar:sonar \
            -Dsonar.projectKey=Jagadeesh-Tadepalli-M_MyProject-Ledger-service \
            -Dsonar.organization=jagadeesh-tadepalli-m \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.token=${{ secrets.SONAR_TOKEN }}

      - name: SonarCloud Quality Gate
        uses: sonarsource/sonarqube-quality-gate-action@master
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: ledger-service
          path: .
          format: HTML
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

      - name: Upload OWASP Report
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: reports/

      - name: Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: CRITICAL,HIGH

  docker-build-scan-push:
    needs: build-test-security
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Download JAR Artifact
        uses: actions/download-artifact@v4
        with:
          name: ledger-jar
          path: target/

      - name: Build Docker Image
        run: |
          docker build -t ledger-service:latest .

      - name: Clair Container Scan
        uses: quay/clair-action@v0.3.0
        with:
          image-ref: ledger-service:latest

      - name: Trivy Docker Image Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ledger-service:latest
          format: table
          severity: CRITICAL,HIGH

      - name: Tag Docker Image
        run: |
          docker tag ledger-service:latest \
          339140804096.dkr.ecr.ap-southeast-2.amazonaws.com/ledger-service:${{ github.sha }}

          docker tag ledger-service:latest \
          339140804096.dkr.ecr.ap-southeast-2.amazonaws.com/ledger-service:latest

      - name: Push Docker Image
        run: |
          docker push \
          339140804096.dkr.ecr.ap-southeast-2.amazonaws.com/ledger-service:${{ github.sha }}

          docker push \
          339140804096.dkr.ecr.ap-southeast-2.amazonaws.com/ledger-service:latest

  zap-dast-security:
    needs: docker-build-scan-push
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build -t ledger-service:latest .

      - name: Start Ledger Service
        run: |
          docker run -d \
            --name ledger-service \
            -p 8081:8081 \
            ledger-service:latest

      - name: Wait for Application Startup
        run: sleep 40

      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: http://localhost:8081

      - name: Upload ZAP Report
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: report_html.html

